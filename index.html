<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Flappy Semester</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app" aria-label="Flappy Semester Spiel">
      <section class="game-shell">
        <div class="canvas-wrap">
          <canvas id="gameCanvas" width="432" height="768" aria-label="Flappy Semester Spielfeld"></canvas>
          <div id="gameToolbar" class="game-toolbar" aria-label="Spielstatus" hidden>
            <div class="hud-stat">
              <span class="label">Score</span>
              <strong id="scoreText">0</strong>
            </div>
            <div class="hud-stat hud-stat--right">
              <span class="label">Kaffee</span>
              <strong id="coffeeText">0</strong>
            </div>
            <button id="pauseButton" type="button" aria-label="Pause umschalten">Ⅱ</button>
            <p id="missionText" class="mission-hud">Mission: Neuer Run = neue Mission</p>
            <span id="bestText" hidden>0</span>
            <span id="goalLabel" hidden>Ziel</span>
            <span id="goalText" hidden>0</span>
          </div>
          <div id="overlay" class="overlay" data-screen="start">
            <p id="eyebrowText" class="eyebrow">Premium-Panik fuer zwischendurch</p>
            <h1>Flappy<br>Semester</h1>
            <p id="overlayText">Hilf Byte-Basti durch die Koffeinzone, bevor das Modulhandbuch zurueckschlaegt.</p>
            <div id="skinChooser" class="skin-chooser" aria-label="Figur auswaehlen"></div>
            <div class="overlay-actions">
              <button id="primaryButton" type="button">Spielen</button>
              <button id="menuButton" type="button" class="secondary menu-button" hidden>Hauptmenü</button>
              <button id="howToButton" type="button" class="secondary">?</button>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script src="src/standalone.js"></script>
  </body>
</html>
